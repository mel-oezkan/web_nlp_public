<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>

        <script src="./script.js"></script>
        <script src="speech.js"></script>
        <script src="storageHandler.js"></script>

        <script>
            $(document).ready(() => {
                // inialize local storage
                initalizeStorage();
            })
        </script>
    </head>
    <body>

    
        <div class="MainContent">
            <div class="UserInput">
    
                <div class="CustomDropdown">
                    <div class="DropHead">
                        <img src="/static/icons/question_topic.png" alt="">
                        <p>Question Topic</p>
                    </div>
                    <div class="DropContent"></div>
                </div>

                <div class="CustomDropdown">
                    <div class="DropHead">
                        <img src="/static/icons/question_type.png" alt="">
                        <p>Question Type</p>
                    </div>
                    <div class="DropContent"></div>
                </div>

                <div class="CustomDropdown">
                    <div class="DropHead">
                        <img src="/static/icons/question_diff.png" alt="">
                        <p>Question Difficulty</p>
                    </div>
                    <div class="DropContent"></div>
                </div>
    
                <p class="response" id="name" style="color:rgb(0, 0, 0); font-size: 30px"></p>
                <button 
                    class="Btn-Request"
                    type="respose_test" 
                    onclick="run_model()"
                >
                    <img src="/static/icons/add.png" alt="">
                    Generate Question
                </button>

                <button class="btn btn-danger btn-block" onclick="show_answer()">Click to show answer</button>
                <p id="answer" class="answer_box"></p>
            </div>

            <div class="QuestionContent">
                <div class="ActiveContainer"></div>
                <div class="StorageContainer"></div>
            </div>

            </div>
                <button class="btn btn-danger btn-block" onclick="show_feedback()">Click to get feedback</button>
                <p id="feedback" class="answer_box"></p>
            </div>

        </div>


        <button
            onclick="testFunction()"
        >Test ouput</button>

      
    

    </div>
    
    </body>
</html>
