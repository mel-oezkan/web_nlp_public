<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>

        <script src="./script.js"></script>
        <script src="speech.js"></script>
        <script src="storageHandler.js"></script>
        <script src="./intefaceFunctions.js"></script>


        <script>
            $(document).ready(() => {
                // inialize local storage
                initalizeStorage();
            })
        </script>
    </head>
    <body>
    
        <div class="MainContent">
            <div class="UserInput">
    
                <div class="CustomDropdown">
                    <div 
                        class="DropHead"
                        onclick="handleDropdown('QTopic')"
                    >
                        <img src="/static/icons/question_topic.png" alt="">
                        <input type="text" id="Head-QTopic" value="Question Topic" readonly="True">
                    </div>

                    <div 
                        id="Drop-QTopic"
                        class="DropContent"
                    >
                        <a onclick="handleValue('QTopic', 'neurobio')">Neurobiology</a>
                        <a onclick="handleValue('QTopic', 'cl')">Computational Linguisticy</a>
                        <a onclick="handleValue('QTopic', 'philo')">Philosophy</a>
                        <a onclick="handleValue('QTopic', 'neuropsy')">Neuropsychology</a>
                    </div>
                </div>

                <div class="CustomDropdown">
                    <div 
                        class="DropHead"
                        onclick="handleDropdown('QType')"
                    >
                        <img src="/static/icons/question_type.png" alt="">
                        <input type="text" id="Head-QType" value="Question Type" readonly="True">
                    </div>

                    <div 
                        id="Drop-QType"
                        class="DropContent"
                    >
                        <a onclick="handleValue('QType', 'tf')">True/False</a>
                        <a onclick="handleValue('QType', 'mc')">Multiple Choice</a>
                    </div>
                </div>

                <div class="CustomDropdown">
                    <div 
                        class="DropHead"
                        onclick="handleDropdown('QDiff')"
                    >
                        <img src="/static/icons/question_diff.png" alt="">
                        <input type="text" id="Head-QDiff" value="Question Type" readonly="True">
                    </div>

                    <div 
                        id="Drop-QDiff"
                        class="DropContent"
                    >
                        <a onclick="handleValue('QDiff', 'easy')">easy</a>
                        <a onclick="handleValue('QDiff', 'medium')">medium</a>
                        <a onclick="handleValue('QDiff', 'hard')">hard</a>

                    </div>
                </div>

                
    
                <button 
                    class="Btn-Request"
                    type="respose_test" 
                    onclick="generate_question()"
                >
                    <img src="/static/icons/add.png" alt="">
                    Generate Question
                </button>

            </div>

            <div class="QuestionContent">

                <div class="ActiveContainer">
                    <div class="QuestionContainerHead">
                        <p>Definition</p>

                        <div class="QuestionTypeBlock">
                            <p>F</p>
                        </div>
                    </div>

                </div>
                <div class="StorageContainer"></div>
            </div>

            <p id="answer" class="answer_box"></p>
            <p class="response" id="name" style="color:rgb(0, 0, 0); font-size: 30px"></p>


        </div>



      
    

    </div>
    
    </body>
</html>
