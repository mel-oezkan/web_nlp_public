<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>

        <script src="./script.js"></script>
        <script src="speech.js"></script>
        <script src="storageHandler.js"></script>

        <script>
            $(document).ready(() => {
                // inialize local storage
                initalizeStorage();
            })
        </script>
    </head>
    <body>

        <div class="MainContent">
            <button
                onclick="generate_question()"
            >Test ouput</button>
        <div class="ContentInput">

        <div class="PromptInput">
            <p>Enter a topic:</p>
            <input type="text" id="input">
        </div>    

        
        <div class="ModeSelector">
            <label for="mode">Choose a difficulty:</label>
            <select name="mode" id="mode">
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="UserInput">

            

            <p class="response" id="name" style="color:rgb(0, 0, 0); font-size: 30px"></p>
            <button 
                class="Btn-Request"
                type="respose_test" 
                onclick="run_model()"
            >
                <img src="/static/icons/add.png" alt="">
                Generate Question
            </button>

            <button class="btn btn-danger btn-block" onclick="show_answer()">Click to show answer</button>
            <p id="answer" class="answer_box"></p>
        </div>
        </div>
        <button class="btn btn-danger btn-block" onclick="show_feedback()">Click to get feedback</button>
        <p id="feedback" class="answer_box"></p>

        <br>
        <br>

        <div>
            ----------- Speech Test -----------
        </div>

        <br>
        <br>

        <button id="start-btn" class="btn btn-danger btn-block">Start</button>
        <p id="instructions">Press the Start button</p>

        <textarea id="textbox" rows="6" class="form-control"></textarea>


        <button
            onclick="debugAddStorage()"
        >Add Question</button>
        <button
            onclick="debug_print_storage()"
        >Log Question</button>
        <button
            onclick="reset_storage()"
        >Delete Questions</button>

        <button
            onclick="testFunction()"
        >Test ouput</button>

      
    

    </div>
    
    </body>
</html>
