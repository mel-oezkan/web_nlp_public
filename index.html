<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
        <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
    </head>
    <body>

        <div class="MainContent">

        <div>
            <p class="response" id="name_2" style="color:rgb(0, 0, 0); font-size: 30px"></p>
            <button type="respose_test" onclick="fetchRequest()">Fetch request test (console)</button>
        </div>

        <div class="ContentInput">

        <div class="PromptInput">
            <p>Enter some text for completion below:</p>
            <input type="text" id="input">
        </div>    

        
        <div class="ModeSelector">
            <label for="mode">Choose a difficulty:</label>
            <select name="mode" id="mode">
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div 
            class="UserInput"
        >
            <p class="response" id="name" style="color:rgb(0, 0, 0); font-size: 30px"></p>
            <button 
                class="Btn-Request"
                type="respose_test" 
                onclick="run_model()"
            >
                Direct API test
            </button>
        </div>
        </div>


        <br>
        <br>

        <div>
            ----------- Speech Test -----------
        </div>

        <br>
        <br>

        <button id="start-btn" class="btn btn-danger btn-block">Start</button>
        <p id="instructions">Press the Start button</p>

        <textarea id="textbox" rows="6" class="form-control"></textarea>

        <script src="script.js"></script>
        <script src="speech.js"></script>
    
    </div>
    
    </body>
</html>
